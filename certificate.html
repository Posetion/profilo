<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Level 6B Certificate — Kaung Myat Tun</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #000;
      --surface: #141414;
      --border: #2a2a2a;
      --text: #fff;
      --muted: #8a8a8a;
      --font: "Inter", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100svh;
      padding: 1.25rem;
    }
    .bar {
      max-width: 980px;
      margin: 0 auto 1.25rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: space-between;
      align-items: center;
    }
    .bar a, .bar button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.7rem 1.15rem;
      border-radius: 999px;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      color: inherit;
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
    }
    .bar .primary {
      background: #fff;
      color: #000;
      border-color: #fff;
    }
    h1 {
      max-width: 980px;
      margin: 0 auto 0.35rem;
      font-size: 1.5rem;
      letter-spacing: -0.02em;
    }
    .sub {
      max-width: 980px;
      margin: 0 auto 1.25rem;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .frame {
      max-width: 980px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 0.75rem;
      overflow: auto;
    }
    .frame img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
      background: #111;
    }
  </style>
</head>
<body>
  <div class="bar">
    <a href="index.html">← Back to portfolio</a>
    <div style="display:flex; gap:0.6rem; flex-wrap:wrap;">
      <a href="certificates/english-6b.png" download="Kaung-Myat-Tun-English-6B.png">Download image</a>
      <a class="primary" href="certificates/Certificate_GE%20(1).pdf" target="_blank" rel="noopener noreferrer">Open PDF</a>
    </div>
  </div>
  <h1>English Level 6B Certificate</h1>
  <p class="sub">Kaung Myat Tun — viewable certificate image (works without a PDF reader).</p>
  <div class="frame">
    <img src="certificates/english-6b.png" alt="English Level 6B certificate for Kaung Myat Tun" />
  </div>
</body>
</html>
